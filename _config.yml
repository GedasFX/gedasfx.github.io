# Chirpy: https://github.com/cotes2020/jekyll-theme-chirpy/wiki
theme: jekyll-theme-chirpy

lang: en
timezone: Europe/Vilnius
title: gedas.dev
tagline: A quest of sorts :>
description: >-
  Notes from my homelab and side projects: what I tried, what I measured, what broke.
url: "https://blog.gedas.dev"
baseurl: ""
avatar: /assets/img/avatar.png

github:
  username: gedasfx
social:
  name: GedasFX
  email: contact@gedas.dev
  links:
    - https://github.com/gedasfx
    - https://www.linkedin.com/in/gediminas-milasius

toc: true
paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      # Reverie's URLs; already shared, so they stay
      permalink: /:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - README.md
  - LICENSE

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
